<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashain Countdown</title>

  <!-- Dashain Font -->
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Mukta', sans-serif;
      background-color: #8bcacf;
      background-size: cover;
      color: #ffcc00;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      text-shadow: 1px 1px 2px #000;
    }

    h1 {
      font-size: 3rem;
      color: #ffd700;
      margin-bottom: 10px;
      animation: fadeIn 2s ease-in-out;
      position: relative;
    }

    p.subtitle {
      font-size: 1.3rem;
      color: #fff;
      margin-bottom: 30px;
      animation: fadeIn 2.5s ease-in-out;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 30px;
      border-radius: 12px;
      border: 2px solid #ffcc00;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      max-width: 600px;
      width: 100%;
      text-align: center;
      animation: fadeIn 3s ease-in-out;
    }

    .countdown {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      
      
    }

    .countdown div {
      background: rgba(255, 255, 255, 0.2);
      padding: 20px;
      border-radius: 10px;
      min-width: 100px;
      border: 0px solid #ffcccc;
      
    }

    .countdown span {
      display: block;
      font-size: 2rem;
      font-weight: bold;
      color: #ffcc00;
    }

    .label {
      font-size: 1.3rem;
      opacity: 0.9;
    }

    footer {
      margin-top: 40px;
      font-size: 1rem;
      color: #fff;
    }

    iframe {
      display: none; /* Hide the iframe visually */
    }

    @media (max-width: 500px) {
      .countdown div {
        min-width: 80px;
        padding: 15px;
      }

      .countdown span {
        font-size: 1.5rem;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- 🎉 Welcome Message -->
  <h1>🎉 Happy Dashain 2082! 🎉</h1>
  <p class="subtitle">⏳ TIME LEFT TO CELEBRATE</p>

  <!-- Countdown Container -->
  <div class="container">
    <div class="countdown" id="countdownDisplay">
      <div><span id="years">0</span><div class="label">Years</div></div>
      <div><span id="months">0</span><div class="label">Months</div></div>
      <div><span id="days">0</span><div class="label">Days</div></div>
      <div><span id="hours">0</span><div class="label">Hours</div></div>
      <div><span id="minutes">0</span><div class="label">Minutes</div></div>
      <div><span id="seconds">0</span><div class="label">Seconds</div></div>
    </div>
  </div>

  <!-- 🎵 Background YouTube Song -->
  <iframe width="0" height="0" src="https://www.youtube.com/embed/VyYhZqtvbWU?autoplay=1&loop=1&playlist=VyYhZqtvbWU" frameborder="0" allow="autoplay" allowfullscreen></iframe>

  <footer>
    🪔 Wishing you happiness, health, and blessings this Dashain!
  </footer>

  <script>
    function startFixedCountdown() {
      const targetDate = new Date("2025-09-22T00:00:00");
      
      setInterval(() => {
        const now = new Date();
        let diff = targetDate - now;

        if (diff <= 0) {
          document.querySelector('.countdown').innerHTML = "<h2>Dashain is Here! 🪔🎉</h2>";
          return;
        }

        const current = {
          year: now.getFullYear(),
          month: now.getMonth(),
          day: now.getDate(),
          hour: now.getHours(),
          minute: now.getMinutes(),
          second: now.getSeconds()
        };

        const target = {
          year: targetDate.getFullYear(),
          month: targetDate.getMonth(),
          day: targetDate.getDate(),
          hour: targetDate.getHours(),
          minute: targetDate.getMinutes(),
          second: targetDate.getSeconds()
        };

        let years = target.year - current.year;
        let months = target.month - current.month;
        let days = target.day - current.day;
        let hours = target.hour - current.hour;
        let minutes = target.minute - current.minute;
        let seconds = target.second - current.second;

        if (seconds < 0) {
          seconds += 60;
          minutes--;
        }

        if (minutes < 0) {
          minutes += 60;
          hours--;
        }

        if (hours < 0) {
          hours += 24;
          days--;
        }

        if (days < 0) {
          const previousMonth = new Date(now.getFullYear(), now.getMonth(), 0);
          days += previousMonth.getDate();
          months--;
        }

        if (months < 0) {
          months += 12;
          years--;
        }

        document.getElementById("years").textContent = years;
        document.getElementById("months").textContent = months;
        document.getElementById("days").textContent = days;
        document.getElementById("hours").textContent = hours;
        document.getElementById("minutes").textContent = minutes;
        document.getElementById("seconds").textContent = seconds;
      }, 1000);
    }

    startFixedCountdown();
  </script>
</body>
</html>
