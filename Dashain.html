<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Dashain 2083</title>

<link rel="stylesheet" href="dashaincss.css">

</head>

<body>

<h1>🎉 Happy Dashain 2083 🎉</h1>

<h2>

🙏 आयु, धन, समृद्धि, सुख र शान्तिको शुभकामना 🙏

</h2>

<p class="subtitle">⏳ TIME LEFT TO CELEBRATE</p>

<div class="container">

<div class="countdown">

<div>
<span id="years">0</span>
<p>Years</p>
</div>

<div>
<span id="months">0</span>
<p>Months</p>
</div>

<div>
<span id="days">0</span>
<p>Days</p>
</div>

<div>
<span id="hours">0</span>
<p>Hours</p>
</div>

<div>
<span id="minutes">0</span>
<p>Minutes</p>
</div>

<div>
<span id="seconds">0</span>
<p>Seconds</p>
</div>

</div>

</div>

<div id="currentTime"></div>

<button id="musicBtn">
🎵 Play Dashain Music
</button>

<img src="images/ping.png" class="ping">

<div class="kite"></div>

<div class="kite kite2"></div>

<audio id="bgMusic" loop>
<source src="audio/dashain-song.mp3" type="audio/mpeg">
</audio>

<footer>

🪔 May Goddess Durga bless you and your family with happiness, prosperity and success. Happy Dashain 2083.

</footer>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<script src="script.js"></script>

</body>
</html>
