<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashain Countdown</title>
 <link rel="stylesheet" href="dashaincss.css">
</head>
<body>
  <!-- 🎉 Welcome Message -->
  <h1>🎉 Happy Dashain 2083! 🎉</h1>
  <p class="subtitle">⏳ TIME LEFT TO CELEBRATE</p>

  <!-- Countdown Container -->
  <div class="container">
    <div class="countdown" id="countdownDisplay">
      <div><span id="years">0</span><div class="label">Years</div></div>
      <div><span id="months">0</span><div class="label">Months</div></div>
      <div><span id="days">0</span><div class="label">Days</div></div>
      <div><span id="hours">0</span><div class="label">Hours</div></div>
      <div><span id="minutes">0</span><div class="label">Minutes</div></div>
      <div><span id="seconds">0</span><div class="label">Seconds</div></div>
    </div>
  </div>


  <footer>
    🪔 Wishing you happiness, health, and blessings this Dashain!
  </footer>

  <script>
    function startFixedCountdown() {
      const targetDate = new Date("2026-10-21T00:00:00");
      
      setInterval(() => {
        const now = new Date();
        let diff = targetDate - now;

        if (diff <= 0) {
          document.querySelector('.countdown').innerHTML = "<h2>Dashain is Here! 🪔🎉</h2>";
          return;
        }

        const current = {
          year: now.getFullYear(),
          month: now.getMonth(),
          day: now.getDate(),
          hour: now.getHours(),
          minute: now.getMinutes(),
          second: now.getSeconds()
        };

        const target = {
          year: targetDate.getFullYear(),
          month: targetDate.getMonth(),
          day: targetDate.getDate(),
          hour: targetDate.getHours(),
          minute: targetDate.getMinutes(),
          second: targetDate.getSeconds()
        };

        let years = target.year - current.year;
        let months = target.month - current.month;
        let days = target.day - current.day;
        let hours = target.hour - current.hour;
        let minutes = target.minute - current.minute;
        let seconds = target.second - current.second;

        if (seconds < 0) {
          seconds += 60;
          minutes--;
        }

        if (minutes < 0) {
          minutes += 60;
          hours--;
        }

        if (hours < 0) {
          hours += 24;
          days--;
        }

        if (days < 0) {
          const previousMonth = new Date(now.getFullYear(), now.getMonth(), 0);
          days += previousMonth.getDate();
          months--;
        }

        if (months < 0) {
          months += 12;
          years--;
        }

        document.getElementById("years").textContent = years;
        document.getElementById("months").textContent = months;
        document.getElementById("days").textContent = days;
        document.getElementById("hours").textContent = hours;
        document.getElementById("minutes").textContent = minutes;
        document.getElementById("seconds").textContent = seconds;
      }, 1000);
    }

    startFixedCountdown();
  </script>
</body>
</html>
