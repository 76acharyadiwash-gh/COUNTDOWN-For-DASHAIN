<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Dashain 2083</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
<div id="petals"></div>
<h1>🎉 Happy Dashain 2083 🎉</h1>

<h2>

🙏 आयु, धन, समृद्धि, सुख र शान्तिको शुभकामना 🙏

</h2>

<p class="subtitle">⏳ TIME LEFT TO CELEBRATE</p>

<div class="container">

<div class="countdown">

<div>
<span id="years">0</span>
<p>Years</p>
</div>

<div>
<span id="months">0</span>
<p>Months</p>
</div>

<div>
<span id="days">0</span>
<p>Days</p>
</div>

<div>
<span id="hours">0</span>
<p>Hours</p>
</div>

<div>
<span id="minutes">0</span>
<p>Minutes</p>
</div>

<div>
<span id="seconds">0</span>
<p>Seconds</p>
</div>

</div>

</div>

<div id="currentTime"></div>

<button id="musicBtn">
🎵 Play Dashain Music
</button>

<img src="https://cdn.pixabay.com/photo/2022/08/25/11/05/kite-7409966_1280.png" class="ping">

<div class="kite"></div>

<div class="kite kite2"></div>

<div class="kite kite3"></div>

<audio id="bgMusic" loop>
<source src="audio/dashain-song.mp3" type="audio/mpeg">
</audio>

<footer>

🪔 May Goddess Durga bless you and your family with happiness, prosperity and success. Happy Dashain 2083.

</footer>
<script>
  const targetDate = new Date("2026-10-21T00:00:00");

function updateCountdown(){

const now = new Date();

let diff = targetDate - now;

if(diff<=0){

document.querySelector(".container").innerHTML="<h2>🎉 Happy Dashain! 🪔</h2>";

clearInterval(timer);

return;

}

let seconds=Math.floor(diff/1000);

let minutes=Math.floor(seconds/60);

let hours=Math.floor(minutes/60);

let days=Math.floor(hours/24);

let years=Math.floor(days/365);

days%=365;

let months=Math.floor(days/30);

days%=30;

hours%=24;

minutes%=60;

seconds%=60;

document.getElementById("years").innerText=years;
document.getElementById("months").innerText=months;
document.getElementById("days").innerText=days;
document.getElementById("hours").innerText=hours;
document.getElementById("minutes").innerText=minutes;
document.getElementById("seconds").innerText=seconds;

}

updateCountdown();

const timer=setInterval(updateCountdown,1000);

function showTime(){

document.getElementById("currentTime").innerHTML=
"Current Time : "+new Date().toLocaleString();

}

showTime();

setInterval(showTime,1000);

const music=document.getElementById("bgMusic");

const btn=document.getElementById("musicBtn");

btn.addEventListener("click",()=>{

music.play();

btn.innerHTML="🎶 Music Playing";

confetti({

particleCount:250,

spread:180,

origin:{y:.6}



});

});
    const petals = document.getElementById("petals");

const flowers = ["🌸","🌺","🌼","💮"];

for(let i = 0; i < 40; i++){

    const petal = document.createElement("span");

    petal.className = "petal";

    petal.innerHTML = flowers[Math.floor(Math.random()*flowers.length)];

    // Random horizontal position
    petal.style.left = Math.random()*100 + "vw";

    // Random size
    petal.style.fontSize = (15 + Math.random()*25) + "px";

    // Random animation duration
    petal.style.animationDuration = (6 + Math.random()*8) + "s";

    // Random delay
    petal.style.animationDelay = (-Math.random()*15) + "s";

    // Random opacity
    petal.style.opacity = 0.5 + Math.random()*0.5;

    // Random wind drift
    petal.style.setProperty("--drift",(Math.random()*200-100)+"px");

    petals.appendChild(petal);
}
  </script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<script src="script.js"></script>

</body>
</html>
